<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Pomodoro</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        color: #f3f2ef;
        font-family: Geist, "Helvetica Neue", Helvetica, sans-serif;
        user-select: none;
      }
      #rotulo {
        font-size: 20px;
        opacity: 0.7;
      }
      #relogio {
        font-size: 64px;
        font-variant-numeric: tabular-nums;
      }
      #barra {
        width: min(60vw, 480px);
        height: 4px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 2px;
        overflow: hidden;
      }
      #progresso {
        height: 100%;
        background: #7dd3c0;
        width: 0%;
      }

      /* Zona sensivel do topo (PRD §7.6): 260x74px, centrada, botao
         invisivel ate o hover. */
      #zona-urgencia {
        position: fixed;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 260px;
        height: 74px;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 12px;
      }
      #botao-urgencia {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s ease;
        background: rgba(255, 255, 255, 0.12);
        color: #f3f2ef;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 8px;
        padding: 8px 18px;
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      #zona-urgencia:hover #botao-urgencia {
        opacity: 1;
        pointer-events: auto;
      }

      #modal-urgencia {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #modal-urgencia[hidden] {
        display: none;
      }
      #modal-urgencia .caixa {
        background: #17181a;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 28px;
        max-width: 420px;
        text-align: center;
      }
      #modal-urgencia h2 {
        margin: 0 0 12px;
        font-size: 18px;
      }
      #modal-urgencia p {
        margin: 0 0 20px;
        font-size: 14px;
        opacity: 0.8;
        line-height: 1.5;
      }
      #modal-urgencia .botoes {
        display: flex;
        gap: 12px;
        justify-content: center;
      }
      #modal-urgencia button {
        font: inherit;
        font-size: 14px;
        border-radius: 8px;
        padding: 10px 16px;
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.08);
        color: #f3f2ef;
      }
      #confirmar {
        background: #b45252;
        border-color: #b45252;
      }
    </style>
  </head>
  <body>
    <div id="zona-urgencia"><button id="botao-urgencia">Urgência</button></div>

    <div id="rotulo"></div>
    <div id="relogio">--:--</div>
    <div id="barra"><div id="progresso"></div></div>

    <div id="modal-urgencia" hidden>
      <div class="caixa">
        <h2>Interromper a pausa?</h2>
        <p>
          A atividade será encerrada e o modo de bloqueio desativado. O temporizador da pausa
          continua correndo.
        </p>
        <div class="botoes">
          <button id="continuar">Continuar na pausa</button>
          <button id="confirmar">Confirmar urgência</button>
        </div>
      </div>
    </div>

    <script src="/bloqueio.js"></script>
  </body>
</html>
