[package]
name = "pomodoro"
version = "0.1.0"
description = "Timer pomodoro com tomada de foco"
authors = ["Caio Nazario <nazzariocaio@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pomodoro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
url.workspace = true
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript", "derive"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
pomodoro-dominio = { version = "0.1.0", path = "../crates/pomodoro-dominio" }
pomodoro-contrato = { version = "0.1.0", path = "../crates/pomodoro-contrato" }
pomodoro-config = { version = "0.1.0", path = "../crates/pomodoro-config" }
pomodoro-atalhos-gnome = { version = "0.1.0", path = "../crates/pomodoro-atalhos-gnome" }
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2.4.3"
chrono = "0.4"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

